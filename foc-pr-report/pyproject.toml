[project]
name = "foc-pr-report"
version = "0.1.0"
description = "Markdown report for FilOzone GitHub Project 14 (FOC) PR workload by person and status"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "ghprojects-client",
]

[project.scripts]
foc-pr-report = "foc_pr_report.cli:main"

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.uv.sources]
ghprojects-client = { path = "../ghprojects-client", editable = true }
