[project]
name = "filozzy-mcp"
version = "0.1.0"
description = "MCP server for FilOzone GitHub Projects v2 board operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "requests>=2.31",
    "foc-pr-report",
]

[project.scripts]
filozzy-mcp = "filozzy_mcp.server:main"

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.uv.sources]
foc-pr-report = { path = "../foc-pr-report", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["filozzy_mcp"]

[tool.pytest.ini_options]
markers = [
    "integration: calls the live GitHub REST/GraphQL API (requires GITHUB_TOKEN)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
