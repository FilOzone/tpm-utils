name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Ruff lint
        run: uvx --from ruff==0.16.1 ruff check .

      - name: Ruff format check
        run: uvx --from ruff==0.16.1 ruff format --check .

  test-foc-pr-notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier unit tests
        run: python -m unittest discover -p 'test_foc*.py'

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - filozzy-mcp
          - github-projects-client
          - foc-pr-report
          - foc-review-stats
          - github-project-export
          - foc-mechanical-rules
          - network-upgrades
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install package with dev dependencies
        run: uv sync --group dev
        working-directory: ${{ matrix.package }}

      - name: Run unit tests
        run: |
          uv run pytest -m "not integration" || test $? -eq 5
        working-directory: ${{ matrix.package }}
