name: FOC Board Mechanical Rules

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, no mutations)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# Serialize runs rather than letting them overlap: two concurrent runs would
# both restore the same mutation-log cache snapshot, could both move the same
# item, and the later cache save could silently drop the other run's
# mutations. cancel-in-progress stays false so a run in flight (which may
# already be mid-mutation) always finishes rather than being cut off.
concurrency:
  group: foc-board-mechanical-rules
  cancel-in-progress: false

jobs:
  apply-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync
        working-directory: foc-mechanical-rules

      # Some rules (e.g. R-FC-012) depend on the mutation log described in
      # foc-mechanical-rules/README.md#mutation-log. The library itself is
      # agnostic about persistence; this cache step is the runtime decision
      # that makes the CLI's --mutation-log file survive across hourly runs.
      # Restore via a key prefix (most recent run's cache) and always save
      # under a fresh run-scoped key so updates are never lost.
      - name: Restore mutation history cache
        uses: actions/cache/restore@v4
        with:
          path: foc-mechanical-rules/state
          key: foc-mechanical-rules-state-${{ github.run_id }}
          restore-keys: |
            foc-mechanical-rules-state-

      - name: Apply mechanical rules
        env:
          GITHUB_TOKEN: ${{ secrets.FILOZZY_CI_ADD_TO_PROJECT }}
        run: |
          # Live by default; pass dry_run=true via workflow_dispatch to preview.
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="--dry-run"
          fi
          uv run foc-mechanical-rules $ARGS -o "$GITHUB_STEP_SUMMARY"
        working-directory: foc-mechanical-rules

      - name: Save mutation history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: foc-mechanical-rules/state
          key: foc-mechanical-rules-state-${{ github.run_id }}
