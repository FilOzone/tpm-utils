name: FOC-WG PR Notifier

on:
  schedule:
    # Run at 14:00 UTC on weekdays.
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the queue in the Actions log'
        default: true
        type: boolean

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preview the P1 review queue
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: python foc_wg_pr_notifier.py --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.FOC_WG_NOTIFIER_PAT }}
          NOTION_TOKEN: ${{ secrets.FOC_WG_NOTION_TOKEN }}

      - name: Post the P1 review queue
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: python foc_wg_pr_notifier.py
        env:
          GITHUB_TOKEN: ${{ secrets.FOC_WG_NOTIFIER_PAT }}
          NOTION_TOKEN: ${{ secrets.FOC_WG_NOTION_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
