[project]
name = "github-projects-client"
version = "0.1.0"
description = "Context-efficient client library for GitHub Projects v2 boards"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
github-projects-api = "github_projects_client.server.app:main"
github-projects-api-dev = "github_projects_client.server.app:main_dev"

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["github_projects_client"]

[tool.pytest.ini_options]
markers = [
    "integration: calls the live GitHub REST/GraphQL API (requires GITHUB_TOKEN)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27",
]
