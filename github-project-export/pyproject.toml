[project]
name = "github-project-export"
version = "0.1.0"
description = "Export GitHub Organization Project v2 board items to TSV via JSON config"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31",
    "github-projects-client",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
github-project-export = "github_project_export.cli:main"

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.uv.sources]
github-projects-client = { path = "../github-projects-client", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["github_project_export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: calls the live GitHub REST API (requires token)",
]
